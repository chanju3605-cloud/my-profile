<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="홍길동의 개인 프로필 페이지">
  <title>홍길동 | Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <!-- 프로필 카드 -->
    <section class="card profile">
      <img class="avatar" src="images/profile.svg" alt="홍길동 프로필 사진" width="140" height="140">
      <h1 class="name">홍길동</h1>
      <p class="role">웹 개발자 · 서울</p>
      <a class="btn" href="mailto:hello@example.com">연락하기</a>
    </section>

    <!-- 자기소개 -->
    <section class="card">
      <h2>자기소개</h2>
      <p>
        안녕하세요! 사용자에게 편리하고 아름다운 웹 경험을 만드는 것을 좋아하는 개발자 홍길동입니다.
        새로운 기술을 배우고 이를 실제 문제 해결에 적용하는 과정에서 즐거움을 느낍니다.
        꾸준히 성장하며 함께 일하고 싶은 사람이 되는 것이 목표입니다.
      </p>
    </section>

    <!-- 관심 분야 -->
    <section class="card">
      <h2>관심 분야</h2>
      <ul class="tags">
        <li>웹 개발</li>
        <li>UI/UX 디자인</li>
        <li>인공지능</li>
        <li>오픈소스</li>
        <li>데이터 시각화</li>
        <li>사진</li>
      </ul>
    </section>

    <!-- 연락처 -->
    <section class="card">
      <h2>연락처</h2>
      <p class="contact">
        <span class="contact-label">Email</span>
        <a href="mailto:hello@example.com">hello@example.com</a>
      </p>
    </section>

    <footer class="footer">
      <p>&copy; 2026 홍길동. All rights reserved.</p>
    </footer>
  </main>
</body>
</html>
